name: Refresh projections

on:
  schedule:
    - cron: "0 6 * * *"    # 2am ET (EDT, UTC-4) -- GitHub cron is fixed UTC, so this reads as 1am once EST (winter, UTC-5) kicks in
    - cron: "0 15 * * *"   # 11am ET (EDT, UTC-4) -- reads as 10am once EST kicks in
  workflow_dispatch:        # lets you trigger a run manually from the Actions tab
    inputs:
      featured_props_limit:
        description: >-
          How many MLB games get real DraftKings player-prop odds this run.
          COSTS REAL CREDITS: each game is one per-event call billed per
          market returned, measured at 6-8 credits per game (9 markets are
          requested; books do not post all of them for every game). The
          default of 2 is what the twice-daily scheduled runs use and is
          sized to fit the free tier over a month. Raising this is meant for
          a deliberate one-off -- a full 15-game slate is roughly 105
          credits, and at twice a day that would exhaust a 500-credit month
          in under three days. Only same-day games can be priced at all,
          since the bulk odds feed only returns today's slate.
        required: false
        default: "2"

permissions:
  contents: write

# Only one refresh at a time. Without this, a scheduled run already in
# flight keeps building from the commit it checked out at start, then
# commits and deploys that stale build AFTER a newer push has landed --
# silently reverting the live site to pre-push code. Confirmed real: a
# frontend change was pushed, an in-flight run deployed over it, and a
# third run was needed to get the intended state live. cancel-in-progress
# drops the older run instead, since its output is stale by definition
# (every step regenerates from scratch, so nothing is lost by restarting).
concurrency:
  group: refresh-projections
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # notebooks_out/ (fitted model parameters) is gitignored -- a fresh
      # checkout has none of it, so every backtest that writes there has to
      # run before anything that reads its output. Skipping this caused
      # every scheduled run to fail at "Generate current-week projections"
      # (FileNotFoundError on nfl_win_prob_backtest.json) until this fix.
      - name: Pull latest NFL data
        run: python pipeline/nfl/pull_data.py

      # Grades any prediction snapshot (docs/results/nfl_*.json) whose game
      # has now been played, using the schedules/player_stats data just
      # pulled above. Must run before the generator below writes this
      # week's fresh snapshots, so a game that both completed AND is still
      # "current week" (shouldn't normally happen, but just in case) gets
      # graded before being treated as a new pregame snapshot.
      - name: Grade completed-game prediction snapshots
        run: python pipeline/nfl/grade_results.py

      - name: Fit/backtest NFL win-probability model
        run: python pipeline/nfl/backtest_win_prob.py

      # Odds calls are cached (pipeline/common/odds_api.py) so a game's real
      # DraftKings props/lines get fetched once and reused instead of every
      # run (twice daily) re-pulling the same not-yet-played game for
      # however many days it sits in "upcoming" -- this cache has to survive
      # between runs the same way the historical-pull caches above do.
      - name: Restore NFL odds cache
        uses: actions/cache@v4
        with:
          path: data/nfl/odds_cache.json
          key: nfl-odds-cache-${{ github.run_id }}
          restore-keys: |
            nfl-odds-cache-

      - name: Generate current-week NFL projections
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python pipeline/nfl/generate_current_week.py

      # Completed MLB seasons/months never change, so both pull scripts cache
      # their per-season / per-month output to data/mlb/ and skip re-pulling
      # anything already finished -- only the current season (team schedule)
      # and current month (Statcast) are re-fetched live every run. This
      # cache has to survive between runs (a fresh checkout has none of it),
      # so it's restored here and saved back at the end of the job. Using
      # github.run_id as the save key (with a plain prefix as the restore
      # key) means every run saves a new cache entry seeded from the most
      # recent one -- the standard pattern for a cache that keeps growing.
      - name: Restore MLB historical-pull cache
        uses: actions/cache@v4
        with:
          path: |
            data/mlb/team_games_by_season
            data/mlb/statcast_by_month
          key: mlb-data-cache-${{ github.run_id }}
          restore-keys: |
            mlb-data-cache-

      - name: Pull latest MLB team schedule/results
        run: python pipeline/mlb/pull_team_games.py

      - name: Pull latest MLB Statcast game logs
        run: python pipeline/mlb/pull_statcast_gamelogs.py

      - name: Fit/backtest MLB win-probability model
        run: python pipeline/mlb/backtest_win_prob.py

      - name: Fit/backtest MLB starting-pitcher + bullpen blend
        run: python pipeline/mlb/backtest_pitcher_model.py

      # Same odds-caching rationale as NFL's restore step above.
      - name: Restore MLB odds cache
        uses: actions/cache@v4
        with:
          path: data/mlb/odds_cache.json
          key: mlb-odds-cache-${{ github.run_id }}
          restore-keys: |
            mlb-odds-cache-

      - name: Generate current-slate MLB projections
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Scheduled runs have no inputs context, so they fall through to
          # the same "2" the code already defaults to -- only a manual run
          # that deliberately sets this spends extra credits.
          FEATURED_PROPS_LIMIT: ${{ github.event.inputs.featured_props_limit || '2' }}
        run: python pipeline/mlb/generate_daily_slate.py

      # Same per-season caching convention as MLB's above -- completed NHL
      # seasons never change, so only the current season is re-pulled live
      # every run.
      - name: Restore NHL historical-pull cache
        uses: actions/cache@v4
        with:
          path: data/nhl/team_games_by_season
          key: nhl-data-cache-${{ github.run_id }}
          restore-keys: |
            nhl-data-cache-

      - name: Pull latest NHL game results
        run: python pipeline/nhl/pull_games.py

      # data/nhl/goalie_game_logs.parquet is git-committed (a narrow
      # .gitignore exception -- see the comment there), so this checkout
      # already has the full historical backfill; this only needs to pull
      # whatever games have completed since the last run, which is fast.
      - name: Pull latest NHL goalie boxscores
        run: python pipeline/nhl/pull_goalie_games.py

      - name: Fit/backtest NHL win-probability model
        run: python pipeline/nhl/backtest_win_prob.py

      - name: Generate current-slate NHL projections
        run: python pipeline/nhl/generate_current_slate.py

      # Lets deploy-cosmetic.yml (UI/CSS-only changes) rebuild and redeploy
      # the site in seconds without re-running this whole pipeline -- it
      # restores this same cache instead of re-pulling anything. Save-only
      # (this job never needs to restore it, since it always generates
      # fresh data), same ever-growing-cache key pattern as the historical
      # pull caches above.
      - name: Save current dashboard data for cosmetic-only deploys
        uses: actions/cache/save@v4
        with:
          path: |
            data/nfl/dashboard_current_week.json
            data/mlb/dashboard_current_slate.json
            data/nhl/dashboard_current_slate.json
          key: dashboard-data-cache-${{ github.run_id }}

      - name: Build static site
        run: python pipeline/nfl/build_static_site.py

      # The paid half of the data (player props and everything derived from
      # them) is NOT in the commit above -- build_static_site.py writes it to
      # data/gated_payload.json, which is git-ignored, precisely so it never
      # reaches this public repo or the GitHub Pages copy that serves it
      # directly. It goes to Cloudflare KV instead, where site-worker.js is
      # the only thing that can hand it out.
      #
      # No-ops cleanly until the namespace exists, so this can ship ahead of
      # the Cloudflare setup without breaking a scheduled run. Set up once:
      #   npx wrangler kv namespace create GATED
      # then save the printed id as the GATED_KV_NAMESPACE_ID repo secret.
      # (--namespace-id is used rather than --binding so this does not
      # depend on the kv_namespaces block in wrangler.toml, which stays
      # commented out until the id is real.)
      #
      # Published before the deploy below, so the newly built page never
      # goes live ahead of the payload it expects. The reverse order would
      # leave a window where the two build stamps disagree; the page treats
      # that as "show free content", never as "show yesterday's props".
      - name: Publish gated payload to Cloudflare KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node pipeline/nfl/build_account_payload.mjs
          node pipeline/nfl/verify_account_split.mjs
          ls -lh data/gated_payload.json data/gated_payload_account.json
          npx wrangler kv key put current --path data/gated_payload.json --binding GATED --remote
          npx wrangler kv key put current:account --path data/gated_payload_account.json --binding GATED --remote

      # main can move forward while this ~30-40min pipeline is running (a
      # manual code push, another workflow run), which makes a plain `git
      # push` fail with a rejected non-fast-forward -- this happened for
      # real once a manual push landed mid-run. docs/index.html and
      # docs/results/ are fully regenerated every run (not incrementally
      # patched), so there's no real content to reconcile on a collision:
      # retry by re-basing the commit onto whatever is newest and pushing
      # again, rather than just failing.
      #
      # IMPORTANT: the retry must be a real `git rebase`, not `git reset
      # --soft origin/main`. A soft reset moves HEAD but leaves the index/
      # working tree exactly as they were -- for every file this job's
      # commit DIDN'T touch, that's still whatever was in this job's
      # (possibly stale, pre-race) checkout, not origin/main's real content.
      # Re-adding only docs/*/data paths and recommitting then bakes that
      # staleness in as a real commit with a misleadingly current parent --
      # this silently reverted a real source change once already (a shipped
      # frontend feature quietly disappeared for several commits until
      # caught by chance). `git rebase -X ours` replays this commit's actual
      # diff on top of the new tip instead: files we didn't touch correctly
      # take origin/main's latest content, and our regenerated docs/*/data
      # files win on any conflict (there's nothing to reconcile there since
      # they're full regenerations, not patches).
      - name: Commit and push updated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/404.html docs/results/ data/nhl/goalie_game_logs.parquet
          if git diff --quiet --cached; then
            echo "Nothing to commit."
          else
            git commit -m "Auto-refresh NFL + MLB projections"
            for i in 1 2 3 4 5; do
              git fetch origin main
              if git push origin main; then
                break
              fi
              echo "Push rejected (remote moved), rebasing onto the latest main..."
              git rebase -X ours origin/main
              sleep 5
            done
          fi

      # Cloudflare becomes the real hosting -- faster/more reliable CDN than
      # GitHub Pages, and we hit a real GitHub Pages deploy 503 once already.
      # Kept alongside the git push above (not replacing it) during the
      # transition so GitHub Pages still works as a fallback until
      # Cloudflare's been verified in production for a while.
      #
      # `wrangler pages deploy` (and the cloudflare/pages-action GitHub
      # Action, tried first) both target the classic Pages Projects API,
      # which returned "The Pages project 'phins-up' does not exist" --
      # wrangler's own error pointed out this project is actually a Worker
      # (its serving domain is workers.dev, not pages.dev), Cloudflare's
      # newer unified static-hosting platform, deployed via `wrangler
      # deploy` reading the repo-root wrangler.toml's [assets] block.
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
