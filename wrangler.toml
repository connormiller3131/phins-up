# Deploys docs/ as a Cloudflare Worker with static assets (Cloudflare's
# current recommended way to serve a static site -- classic "Pages
# Projects" is being superseded by this).
#
# site-worker.js is the entry point (not a pure asset-only worker) so it can
# force a no-cache header on every response -- the docs/_headers convention
# is NOT honored by this platform (confirmed against a real stale response),
# so this is the reliable way to control caching for a site that regenerates
# twice daily.
#
# Deploy: npx wrangler deploy (from the repo root)
name = "phinsup"
main = "site-worker.js"
compatibility_date = "2024-01-01"

# phinsup.net was bought directly through Cloudflare (already on Cloudflare's
# own nameservers), so this attaches it as a custom domain automatically on
# every deploy -- no manual dashboard step or external DNS change needed.
# MUST be a top-level key, not nested under [assets] -- a real deploy warned
# "Unexpected fields found in assets field: routes" when this was placed
# after the [assets] section below, meaning TOML silently scoped it into
# that table instead of applying it as a real route. Likely explains why the
# custom domain kept serving stale content no matter what: its binding
# probably wasn't being correctly re-applied on later deploys at all.
routes = [
  { pattern = "phinsup.net", custom_domain = true },
  { pattern = "www.phinsup.net", custom_domain = true },
]

[assets]
directory = "./docs"
binding = "ASSETS"
# By default Cloudflare serves a matching static asset directly and never
# invokes the attached Worker script at all -- confirmed this the hard way:
# site-worker.js's Cache-Control override wasn't showing up on ANY request,
# even a fresh workers.dev one with otherwise-correct (non-stale) content.
# This forces every request through the script first so it can actually
# rewrite the response header.
run_worker_first = true
# "none" means a missing asset comes back as a real 404 from this binding,
# and site-worker.js decides what that means: a pre-rendered page under
# <path>/index.html, a client-side route of the app, or a genuine 404.
#
# It was "single-page-application" until per-game pages existed, because that
# setting answers any unmatched path with index.html and so kept deep links
# like /nfl/week1 working across a refresh. The Worker now does that itself,
# deliberately: SPA mode also answered /robots.txt, /sitemap.xml and every
# nonexistent URL with 414 KB of app at a 200 status, which is a soft 404 and
# actively harmful to indexing. Do not set this back without moving the
# fallback logic somewhere else -- deep links break the moment it is "none"
# with no Worker-side handling.
#
# The 307-to-"/" behaviour an earlier note recorded here is REAL and still
# happens under "none" -- it was dismissed once during this change and it
# immediately broke every deep link on the live site. env.ASSETS.fetch()
# returns that 307 rather than a 404, so site-worker.js treats any redirect
# from the binding as a miss and resolves the path itself. Verified against
# production: /nfl/week1 serves the app, /nfl/2026/week-1/<game> serves its
# page at 200 with no redirect, /wp-admin is a real 404.
not_found_handling = "none"

# Gated payload store -- the paid half of the data (player props and
# everything derived from them), which site-worker.js serves at /api/gated
# instead of it being inlined into the committed, publicly-served docs/.
#
# This id is the single source of truth for the namespace: the workflows
# publish with `--binding GATED`, which reads it from right here, rather
# than carrying a duplicate copy in a repo secret that could drift out of
# step with this one. A namespace id is addressing, not a credential --
# reaching the data still needs the Cloudflare API token, which lives in
# Actions secrets and never in this file.
[[kv_namespaces]]
binding = "GATED"
id = "c1ca23642f584fd7a1f7f7971060134e"
